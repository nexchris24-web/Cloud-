name: Tailscale RDP

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  rdp-session:
    runs-on: windows-latest
    timeout-minutes: 360 # Maximum allowed job duration (6 hours)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Enable Remote Desktop & Set Password
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          # Explicitly allow RDP on all profiles (fixes Tailscale Public network block)
          New-NetFirewallRule -DisplayName "RDP-Inbound-AllProfiles" -Profile Any -Direction Inbound -Action Allow -Protocol TCP -LocalPort 3389
          
          # Disable Windows password complexity so numeric passwords (7738617273) are accepted
          $cfg = "$env:temp\sec.cfg"
          secedit /export /cfg $cfg
          (Get-Content $cfg) -replace 'PasswordComplexity\s*=\s*1', 'PasswordComplexity = 0' | Set-Content $cfg
          secedit /configure /db "$env:temp\sec.sdb" /cfg $cfg /areas SECURITYPOLICY
          
          # Set password for runneradmin
          net user runneradmin 7738617273
          Write-Host "RDP Enabled and Password Updated Successfully."

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest

      - name: Keep Runner Alive
        shell: pwsh
        run: |
          Write-Host "Tailscale connected! You can now connect via RDP using the runner's Tailscale IP."
          Start-Sleep -Seconds 21600
          
